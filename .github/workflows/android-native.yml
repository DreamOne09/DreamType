name: Android emulator probe
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Enable runner KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Install build tools
        run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;35.0.0"'
      - run: python scripts/build_emulator_probe.py
      - name: Install isolated backend test dependencies
        run: pip install fastapi==0.141.1 httpx==0.28.1 python-multipart==0.0.32 cryptography==50.0.1 av==18.1.0
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          disable-animations: true
          script: |
            adb install -t work/emulator-probe/probe.apk
            adb shell am instrument -w tw.localvoice.keyboard/.SmokeInstrumentation | tee work/emulator-probe/result.txt
            grep -q 'dreamtype=passed' work/emulator-probe/result.txt
            adb pull /sdcard/Android/data/tw.localvoice.keyboard/files work/emulator-probe/screenshots
            adb shell am force-stop tw.localvoice.keyboard
            adb shell am start -W -a android.intent.action.MAIN -c android.intent.category.LAUNCHER -n tw.localvoice.keyboard/.HomeActivity
            sleep 3
            adb exec-out screencap -p > work/emulator-probe/screenshots/launcher-home.png
            python scripts/check_native_ime.py
            python scripts/check_native_ime.py --account
            python scripts/check_native_ime.py --backend
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-probe-evidence
          path: |
            work/emulator-probe/result.txt
            work/emulator-probe/ime-result.json
            work/emulator-probe/ime-instrumentation.txt
            work/emulator-probe/account-ime-result.json
            work/emulator-probe/account-ime-instrumentation.txt
            work/emulator-probe/account-delivered.txt
            work/emulator-probe/backend-ime-result.json
            work/emulator-probe/backend-ime-instrumentation.txt
            work/emulator-probe/backend-delivered.txt
            work/emulator-probe/screenshots
