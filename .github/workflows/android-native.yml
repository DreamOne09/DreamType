name: Android emulator probe
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Enable runner KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Install build tools
        run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;35.0.0"'
      - run: python scripts/build_emulator_probe.py
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          disable-animations: true
          script: |
            adb install -t work/emulator-probe/probe.apk
            adb shell am instrument -w tw.localvoice.keyboard/.SmokeInstrumentation | tee work/emulator-probe/result.txt
            grep -q 'dreamtype=passed' work/emulator-probe/result.txt
            adb pull /sdcard/Android/data/tw.localvoice.keyboard/files work/emulator-probe/screenshots
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-probe-evidence
          path: |
            work/emulator-probe/result.txt
            work/emulator-probe/screenshots
