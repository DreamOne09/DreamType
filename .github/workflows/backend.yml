name: Backend safety checks
on: [push, pull_request]
jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install fastapi==0.141.1 httpx==0.28.1 python-multipart==0.0.32 cryptography==50.0.1
      - run: python -m unittest test_beta test_backup test_durability test_maintenance test_translation test_operations test_session_race
        working-directory: outputs/local_voice
