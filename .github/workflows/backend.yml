name: Backend safety checks
on: [push, pull_request]
jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install fastapi==0.141.1 httpx==0.28.1 python-multipart==0.0.32 cryptography==50.0.1 av==18.1.0 psutil==7.2.2 numpy==2.5.3 opencc-python-reimplemented==0.1.7
      - run: pip install -r outputs/local_voice/requirements-r2-lock.txt
      - run: python -m unittest discover -s scripts -p 'test_*.py'
      - run: python -m unittest discover -s outputs/local_voice -p 'test_*.py'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Check account workspace retry and isolation contracts
        run: node --test outputs/local_voice/test_web_dictation.mjs

  web-workspace:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install playwright==1.58.0
      - run: python -m playwright install --with-deps chromium
      - run: python scripts/check_web_workspace.py --output work/web-workspace
      - run: python scripts/check_web_preferences.py --output work/web-workspace
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: web-workspace-evidence
          path: work/web-workspace

  speech-hint-windows:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install faster-whisper==1.2.1 ctranslate2==4.8.2 av==18.1.0 numpy==2.5.3
      - name: Verify vocabulary across actual decoder windows without weights
        run: python scripts/check_speech_hint_windows.py

  android-contracts:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Android compile platform
        run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36"'
      - name: Check networking and encrypted recording contracts
        run: python scripts/check_android_contracts.py --android-jar "$ANDROID_HOME/platforms/android-36/android.jar"
