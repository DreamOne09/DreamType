<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DreamType · 說完，就寫好了</title>
<style>
:root{color-scheme:light;--ink:#153d35;--muted:#51655e;--paper:#fcfbf9;--line:#d8deda;--primary:#f5a9c5;--control:#778980;--white:#fff;font:17px/1.65 system-ui,"Microsoft JhengHei","PingFang TC",sans-serif;color:var(--ink);background:var(--paper)}*{box-sizing:border-box}[hidden]{display:none!important}body{margin:0}header,main,footer{max-width:1080px;margin:auto;padding:24px 32px}header{display:flex;align-items:center;justify-content:space-between;gap:16px}a{color:inherit;text-underline-offset:4px}header strong{font-size:23px;letter-spacing:-1px}nav{display:flex;gap:20px;flex-wrap:wrap;font-size:15px}nav a{min-height:44px;display:inline-flex;align-items:center}h1{font-size:clamp(30px,5vw,42px);letter-spacing:-1.5px;line-height:1.3;margin:24px 0 12px}h2{font-size:23px;line-height:1.4;margin:0 0 12px}.intro{text-align:center;margin-bottom:32px}p{margin:8px 0 20px}.muted,small{color:var(--muted)}section{background:var(--white);border:1px solid var(--line);border-radius:24px;padding:28px}#signin{max-width:480px;margin:0 auto}label{display:block;margin:12px 0;font-size:15px;font-weight:550}input,select,textarea,button{font:inherit}input,select,textarea{width:100%;padding:12px 14px;border:1px solid #92929a;border-radius:12px;background:white;color:var(--ink)}input{margin-top:6px}button,.link{min-height:48px;border:1px solid var(--line);border-radius:12px;padding:10px 16px;background:white;color:var(--ink);cursor:pointer;touch-action:manipulation;transition:background .15s ease,border-color .15s ease}button:hover{background:#f1f1f2;border-color:#92929a}button.primary{background:var(--primary);color:var(--ink);border-color:var(--ink)}button.primary:hover{background:#f2a0bf}button:disabled{opacity:.45;cursor:default}:focus-visible{outline:3px solid var(--ink);outline-offset:4px}#login button,#google-signin>button{width:100%}#google-signin{border-top:1px solid var(--line);margin-top:20px;padding-top:20px}#google-signin:empty,#google-signin:has(>button[hidden]):has(>div:empty){display:none}#google-signin button{margin:4px 0}.studio{display:grid;grid-template-columns:minmax(0,360px) minmax(0,1fr);gap:16px 24px;margin:0 auto}.studio:has(#result[hidden]){grid-template-columns:minmax(0,480px);justify-content:center}#workspace{grid-column:1;grid-row:1}#status{grid-column:1;grid-row:2;min-height:48px;margin:0;padding:4px 12px;text-align:center;white-space:pre-wrap;font-size:15px}#result{grid-column:2;grid-row:1/span 2;min-width:0}.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}.row>*{flex:1;min-width:0}.identity-row{padding-bottom:14px;margin-bottom:14px;border-bottom:1px solid var(--line)}#identity{font-size:14px;color:var(--muted);overflow-wrap:anywhere}.identity-row #logout{flex:0 0 auto;border:0;background:transparent;padding:8px}select{font-size:16px}.record-area{text-align:center;padding:20px 0 12px}.record{width:152px;height:152px;border-radius:50%;border:1px solid var(--control);background:var(--primary);color:var(--ink);display:inline-flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;font-weight:550;font-size:18px;box-shadow:none}.record:hover{background:#f2a0bf}.record svg{width:34px;height:34px}.record[aria-pressed=true]{box-shadow:0 0 0 8px #e9e9ea,0 0 0 9px #aaa;animation:breathe 2s ease-in-out infinite}.record[aria-pressed=true] .mic{display:none}.record:not([aria-pressed=true]) .stop{display:none}#clock{font-size:14px;color:var(--muted);font-variant-numeric:tabular-nums;display:block;margin:20px 0 12px}#cancel{min-width:180px}#text{min-height:320px;line-height:1.9;resize:vertical;font-size:18px;margin:4px 0 16px}#result>label{font-size:19px;margin-top:0}summary{cursor:pointer;padding:12px 0;min-height:48px;font-size:15px}#recover{border:0;background:transparent;text-decoration:underline;text-underline-offset:4px}#retry,#receipt{background:var(--primary);color:var(--ink)}#receipt{width:100%;margin-top:12px}footer{font-size:13px;color:var(--muted);padding-top:32px;padding-bottom:40px;max-width:800px;text-align:center}.studio details small{display:block;font-size:14px;line-height:1.7}@keyframes breathe{50%{box-shadow:0 0 0 10px #ececed,0 0 0 11px #bbb}}@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}@media(max-width:700px){header,main,footer{padding:16px}header{align-items:flex-start}nav{gap:12px;font-size:14px}h1{margin-top:12px}.intro{margin-bottom:24px}.studio{display:flex!important;flex-direction:column;gap:16px}section{padding:22px;border-radius:20px}#status{min-height:36px}#text{min-height:240px}.record-area{padding-top:18px}footer{text-align:left;font-size:13px}}@media(max-width:360px){header strong{font-size:20px}nav{gap:8px;font-size:13px}section{padding:16px}.row{gap:8px}button{padding:10px 12px}}
</style></head><body>
<header><strong>DreamType</strong><nav aria-label="導覽"><a href="/account">我的帳號</a><a href="/download/localvoice.apk">Android 下載</a></nav></header>
<main><div class="intro"><h1>自然說，清楚寫。</h1><p class="muted">保留你的意思，把口述變成好讀的文字。</p></div>
<section id="signin"><h2>先登入，就能開始。</h2><form id="login"><label>帳號<input id="username" autocomplete="username" maxlength="40" required></label><label>密碼<input id="password" type="password" autocomplete="current-password" maxlength="128" required></label><button class="primary">登入開始</button></form><p><small>試用帳號由管理者提供。<a href="/account">忘記密碼</a></small></p><div id="google-signin"></div></section>
<div class="studio"><section id="workspace" hidden><div class="row identity-row"><span id="identity"></span><button id="logout">登出</button></div>
<div class="row"><label>輸出方式<select id="mode"><option value="organize">整理文字</option><option value="translate">翻譯</option></select></label><label id="target-label" hidden>翻譯成<select id="target"><option value="en">英文</option><option value="ja">日文</option><option value="th">泰文</option><option value="ms">馬來文</option><option value="zh-TW">繁體中文</option><option value="ko">韓文</option><option value="vi">越南文</option><option value="id">印尼文</option></select></label></div>
<details><summary>語音語言與使用說明</summary><label>你說的語言<select id="source"><option value="zh-TW">中文（台灣）</option><option value="auto">自動辨識</option><option value="en">英文</option><option value="ja">日文</option><option value="th">泰文</option><option value="ms">馬來文</option><option value="ko">韓文</option><option value="vi">越南文</option><option value="id">印尼文</option></select></label><small>沿用帳號的個人提示詞與詞庫。每次最多 110 秒；說「幫我寫計畫」只會輸入這句話，不會代你寫計畫。</small></details>
<div class="record-area"><button id="record" class="record" aria-pressed="false"><svg class="mic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><rect x="8" y="2" width="8" height="13" rx="4"/><path d="M5 10v2a7 7 0 0 0 14 0v-2M12 19v3M8 22h8"/></svg><svg class="stop" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><rect x="4" y="4" width="16" height="16" rx="3"/></svg><span id="record-label">開始錄音</span></button><span id="clock">最長 1 分 50 秒</span><button id="cancel" hidden>取消這次錄音</button></div>
<div class="row"><button id="recover">取回上一筆</button><button id="retry" hidden>重試同一筆上傳</button><button id="discard" hidden>放棄本頁重試錄音</button></div>
</section><p id="status" role="status" aria-live="polite"></p>
<section id="result" hidden><label for="text">你的文字</label><textarea id="text" spellcheck="false"></textarea><div class="row"><button id="copy" class="primary">複製文字</button><button id="undo">復原</button><button id="erase">清空文字</button></div><details><summary>辨識原文</summary><p id="raw" style="white-space:pre-wrap"></p><button id="restore">使用辨識原文</button></details><button id="receipt" hidden>確認已收到結果</button></section></div>
</main><footer>錄音與登入憑證只保留在這個分頁的記憶體。主機會加密暫存待處理錄音與短期結果。請先複製文字再離開；登出會清除本頁資料。<a href="/account">資料處理說明</a> · <a href="/private">主機擁有者入口</a></footer>
<script type="module" src="/web/dictate.mjs"></script></body></html>
