<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DreamType · 說完，就寫好了</title>
<style>
:root{color-scheme:light;font:17px/1.65 system-ui,"Microsoft JhengHei","PingFang TC",sans-serif;color:#18181b;background:#fafafa}*{box-sizing:border-box}[hidden]{display:none!important}body{margin:0}header,main,footer{max-width:760px;margin:auto;padding:24px}header{display:flex;align-items:center;justify-content:space-between;gap:16px}a{color:inherit}header strong{font-size:22px;letter-spacing:-1px}h1{font-size:clamp(28px,5vw,40px);letter-spacing:-1px;margin:16px 0 8px}p{margin:8px 0 20px}.muted,small{color:#555}section{background:white;border:1px solid #d4d4d8;border-radius:24px;padding:24px;margin:20px 0}label{display:block;margin:12px 0}input,select,textarea,button{font:inherit}input,select,textarea{width:100%;padding:12px;border:1px solid #777;border-radius:12px;background:white;color:#18181b}button,.link{min-height:48px;border:1px solid #777;border-radius:12px;padding:10px 18px;background:white;color:#18181b;cursor:pointer;touch-action:manipulation}button.primary{background:#18181b;color:white;border-color:#18181b}button:disabled{opacity:.45;cursor:default}:focus-visible{outline:3px solid #18181b;outline-offset:4px}.row{display:flex;flex-wrap:wrap;gap:12px;align-items:center}.row>*{flex:1}.record-area{text-align:center;padding:24px 0}.record{width:144px;height:144px;border-radius:50%;border:0;background:#18181b;color:white;display:inline-flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;font-weight:600}.record svg{width:32px;height:32px}.record[aria-pressed=true]{outline:3px solid #18181b;outline-offset:8px}.record[aria-pressed=true] .mic{display:none}.record:not([aria-pressed=true]) .stop{display:none}#status{min-height:56px;text-align:center;white-space:pre-wrap}#text{min-height:240px;line-height:1.9;resize:vertical}summary{cursor:pointer;padding:12px 0}footer{font-size:14px;color:#555;padding-bottom:48px}#clock{font-variant-numeric:tabular-nums;display:block;margin:16px}nav{display:flex;gap:16px;flex-wrap:wrap}#identity{overflow-wrap:anywhere}@media(max-width:480px){main,header,footer{padding:16px}section{padding:20px}.row>*{min-width:120px}}
</style></head><body>
<header><strong>DreamType</strong><nav aria-label="導覽"><a href="/account">我的帳號</a><a href="/download/localvoice.apk">Android 下載</a></nav></header>
<main><h1>說完，就寫好了。</h1><p class="muted">保留你的意思，整理成好讀的文字。</p>
<section id="signin"><form id="login"><label>帳號<input id="username" autocomplete="username" maxlength="40" required></label><label>密碼<input id="password" type="password" autocomplete="current-password" maxlength="128" required></label><button class="primary">登入開始</button></form><p><small>試用帳號由管理者提供。<a href="/account">忘記密碼</a></small></p><div id="google-signin"></div></section>
<section id="workspace" hidden><div class="row"><span id="identity"></span><button id="logout">登出</button></div>
<div class="row"><label>輸出方式<select id="mode"><option value="organize">整理文字</option><option value="translate">翻譯</option></select></label><label id="target-label" hidden>翻譯成<select id="target"><option value="en">英文</option><option value="ja">日文</option><option value="th">泰文</option><option value="ms">馬來文</option><option value="zh-TW">繁體中文</option><option value="ko">韓文</option><option value="vi">越南文</option><option value="id">印尼文</option></select></label></div>
<details><summary>語音語言與使用說明</summary><label>你說的語言<select id="source"><option value="zh-TW">中文（台灣）</option><option value="auto">自動辨識</option><option value="en">英文</option><option value="ja">日文</option><option value="th">泰文</option><option value="ms">馬來文</option><option value="ko">韓文</option><option value="vi">越南文</option><option value="id">印尼文</option></select></label><small>沿用帳號的個人提示詞與詞庫。每次最多 110 秒；說「幫我寫計畫」只會輸入這句話，不會代你寫計畫。</small></details>
<div class="record-area"><button id="record" class="record" aria-pressed="false"><svg class="mic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><rect x="8" y="2" width="8" height="13" rx="4"/><path d="M5 10v2a7 7 0 0 0 14 0v-2M12 19v3M8 22h8"/></svg><svg class="stop" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><rect x="4" y="4" width="16" height="16" rx="3"/></svg><span id="record-label">開始錄音</span></button><span id="clock">最長 1 分 50 秒</span><button id="cancel" hidden>取消這次錄音</button></div>
<div class="row"><button id="recover">取回上一筆</button><button id="retry" hidden>重試同一筆上傳</button><button id="discard" hidden>放棄本頁重試錄音</button></div>
</section><p id="status" role="status" aria-live="polite"></p>
<section id="result" hidden><label for="text">你的文字（可以直接修改）</label><textarea id="text" spellcheck="false"></textarea><div class="row"><button id="copy" class="primary">複製文字</button><button id="undo">復原</button><button id="erase">清空文字</button></div><details><summary>辨識原文</summary><p id="raw" style="white-space:pre-wrap"></p><button id="restore">使用辨識原文</button></details><button id="receipt" hidden>確認已收到結果</button></section>
</main><footer>錄音與登入憑證只保留在這個分頁的記憶體。主機會加密暫存待處理錄音與短期結果。請先複製文字再離開；登出會清除本頁資料。<a href="/account">資料處理說明</a> · <a href="/private">主機擁有者入口</a></footer>
<script type="module" src="/web/dictate.mjs"></script></body></html>
