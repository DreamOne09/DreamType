<!doctype html><html lang="zh-Hant"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DreamType 試用管理</title>
<style>body{font:16px/1.6 system-ui;max-width:900px;margin:32px auto;padding:20px;background:#fafafa;color:#18181b}section{background:white;border:1px solid #ddd;border-radius:16px;padding:20px;margin:20px 0}input,button{font:inherit;padding:12px;box-sizing:border-box;border:1px solid #aaa;border-radius:8px}input{max-width:100%}button{cursor:pointer;background:#18181b;color:white}label{display:block;margin:12px 0}label input{display:block;width:100%}table{width:100%;border-collapse:collapse}td,th{text-align:left;padding:10px;border-bottom:1px solid #ddd}.table{overflow:auto}#status{white-space:pre-wrap}button:disabled{opacity:.5}</style>
<h1>DreamType 試用管理</h1><p>建立試用帳號、調整額度與停用權限。此頁不顯示使用者的錄音、文字或個人提示詞。</p>
<section id="signin"><label>管理者金鑰<input id="key" type="password" autocomplete="off"></label><button id="connect">連接管理服務</button><p>金鑰在主機 work/beta/admin.key，不能分享給測試者。</p></section>
<p id="status" role="status" aria-live="polite"></p>
<main id="panel" hidden><section><h2>邀請試用</h2><p>私下提供以下服務網址、帳號和初始密碼。臨時通道重開後需重新整理網址。</p><label>目前服務網址<input id="service" readonly></label></section><section><h2>新增試用帳號</h2><form id="create"><label>帳號（3–40 個英數字）<input id="name" autocomplete="off" required maxlength="40"></label><label>初始密碼（至少 12 字元）<input id="password" type="password" autocomplete="new-password" required minlength="12" maxlength="128"></label><label>每月分鐘額度<input id="minutes" type="number" value="1200" min="0" max="100000" required></label><button>建立帳號</button></form></section><section><h2>帳號與用量</h2><button id="refresh">重新整理</button> <button id="logout">離開管理</button><p id="queue"></p><div class="table"><table><thead><tr><th>帳號</th><th>已用／保留</th><th>每月分鐘</th><th>狀態</th><th>操作</th></tr></thead><tbody id="users"></tbody></table></div></section></main>
<script>
const $=id=>document.getElementById(id);let key='';const fragment=new URLSearchParams(location.hash.slice(1));if(fragment.has('key')){$('key').value=fragment.get('key');history.replaceState(null,'',location.pathname)}
function say(t){$('status').textContent=t}
async function api(path,method='GET',data){const r=await fetch('/v2/admin/'+path,{method,headers:{Authorization:'Bearer '+key,'Content-Type':'application/json'},body:data?JSON.stringify(data):undefined});const body=await r.json();if(!r.ok)throw Error(body.detail||'操作失敗');return body}
async function refresh(){const data=await api('users');$('service').value=data.service_url||'尚未開啟臨時通道';$('users').replaceChildren();$('queue').textContent='等待中的錄音：'+data.queue_size+'；額度按 UTC 月份重置。';for(const u of data.users){const row=document.createElement('tr');for(const s of [u.name,Math.ceil(u.used_seconds/60)+' / '+Math.ceil(u.reserved_seconds/60)+' 分鐘']){const cell=document.createElement('td');cell.textContent=s;row.append(cell)}const amount=document.createElement('input');amount.type='number';amount.min=0;amount.max=100000;amount.value=u.limit_seconds/60;amount.setAttribute('aria-label',u.name+' 的分鐘額度');const c=document.createElement('td');c.append(amount);row.append(c);const active=document.createElement('input');active.type='checkbox';active.checked=u.enabled;active.setAttribute('aria-label','啟用 '+u.name);const a=document.createElement('td');a.append(active);row.append(a);const b=document.createElement('button');b.textContent='儲存';b.onclick=async()=>{b.disabled=true;try{await api('users/'+u.id,'PATCH',{enabled:active.checked,minutes:Number(amount.value)});say('已更新 '+u.name);await refresh()}catch(e){say(e.message)}finally{b.disabled=false}};const d=document.createElement('td');d.append(b);row.append(d);$('users').append(row)}}
$('connect').onclick=async()=>{key=$('key').value.trim();try{await refresh();$('panel').hidden=false;$('signin').hidden=true;$('key').value='';say('已連線')}catch(e){say(e.message);key=''}};
$('create').onsubmit=async e=>{e.preventDefault();const b=e.submitter;b.disabled=true;try{await api('users','POST',{username:$('name').value,password:$('password').value,minutes:Number($('minutes').value)});$('password').value='';say('帳號已建立，請私下提供帳號與密碼給測試者。');await refresh()}catch(e){say(e.message)}finally{b.disabled=false}};
$('refresh').onclick=()=>refresh().catch(e=>say(e.message));$('logout').onclick=()=>{key='';$('panel').hidden=true;$('signin').hidden=false;$('users').replaceChildren();say('已離開管理')};
</script></html>
